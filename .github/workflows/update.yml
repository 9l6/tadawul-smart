name: update-stocks

on:
  schedule:
    - cron: '0 15 * * 0-4'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-stocks:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install-packages
        run: pip install yfinance requests

      - name: run-scraper
        run: python scraper/scraper.py

      - name: push-data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/stocks.json
          git diff --staged --quiet || git commit -m "update stocks $(date +'%Y-%m-%d')"
          git push